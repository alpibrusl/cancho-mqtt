name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The compiler is whichever commit cancho.toml says these sources were
      # written for: one place, which the compiler itself checks.
      - name: Read the compiler pin from cancho.toml
        id: pin
        run: echo "rev=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' cancho.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ steps.pin.outputs.rev }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Put the compiler on PATH
        run: echo "$GITHUB_WORKSPACE/cancho/target/release" >> "$GITHUB_PATH"

      # The reference implementations and the incumbent the later gates compare
      # against (docs/design.md sections 10 and 11). Versions are printed so a
      # run records what it compared with.
      - name: Install Mosquitto and paho
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mosquitto mosquitto-clients jq
          pip install paho-mqtt jsonschema
          mosquitto -h | head -1
          python3 -c "import paho.mqtt, sys; print('paho-mqtt', paho.mqtt.__version__)"

      - name: Formatting
        run: cancho fmt --check src tests generated

      - name: Build (fetches the pinned contract package)
        run: cancho build

      - name: Unit tests
        run: cancho test

      - name: The README's and the page's examples are the program's output
        run: python3 scripts/site.py --check

      - name: The schema is generated, not edited
        run: python3 scripts/schemas.py --check

      - name: Authority report is the compiler's, embedded, within the ceiling (G4)
        run: python3 scripts/manifest.py --check

      - name: The authority gate refuses its mutants (G4 can fail)
        run: python3 scripts/mutants.py

      - name: No file over 2,000 lines (G8)
        run: python3 scripts/lines.py

      - name: The conformance table is generated from the tests
        run: python3 scripts/coverage.py --check

      - name: Conformance (G3, G8, G9), interop and differential against Mosquitto
        run: |
          pip install jsonschema
          python3 -W ignore -m unittest discover -s tests/conformance -v

      # The binary that passed every check above, kept for the release job and
      # for reviewers of a pull request.
      - name: Keep the binary and what describes it
        run: |
          mkdir dist
          cp build/mqtt dist/mqtt-linux-x86_64
          cp manifests/mqtt.authority.json dist/mqtt.authority.json
          (cd dist && sha256sum mqtt-linux-x86_64 > mqtt-linux-x86_64.sha256)
          cat dist/mqtt-linux-x86_64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-linux-x86_64
          path: dist/
          if-no-files-found: error

  # A rolling pre-release named "latest": the project page's download button
  # points at it. Only a push to main publishes; a pull request never does.
  release:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mqtt-linux-x86_64
          path: dist

      - name: Publish the pre-release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          (cd dist && sha256sum -c mqtt-linux-x86_64.sha256)
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --target "$SHA" --prerelease \
            --title "latest (${SHA::7})" \
            --notes "The binary the CI gate built and tested on commit $SHA: formatting, unit, conformance, interop and differential checks passed. Linux x86-64, dynamically linked, built on ubuntu-latest. mqtt.authority.json is the authority report it was compared with. Verify with sha256sum -c mqtt-linux-x86_64.sha256."

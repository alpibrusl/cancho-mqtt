[package]
name = "cancho-mqtt"
cancho = "dcf6751951590aa7f3427001eca3bef0d6677f3b"   # the compiler these sources were written for

[[bin]]
name = "mqtt"
sources = ["src", "generated/mqtt"]
std = true
out = "build/mqtt"

[[test]]
name = "wire"
sources = ["src/wire.cho", "tests/wire_test.cho"]
std = true

[[test]]
name = "topic"
sources = ["src/topic.cho", "tests/topic_test.cho"]
std = true

[[test]]
name = "subs"
sources = ["src/topic.cho", "src/subs.cho", "tests/subs_test.cho"]
std = true

[[test]]
name = "config"
sources = ["src/config.cho", "tests/config_test.cho"]
std = true

[dependencies.describe]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "25acde07f2424c677fddd6a0bd0510a2d5803084"
path = ".cancho-vcs/toolbox.describe"

[[test]]
name = "auth"
sources = ["src/auth.cho", "tests/auth_test.cho"]
std = true

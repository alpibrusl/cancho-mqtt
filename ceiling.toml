# The authority ceiling of the broker (docs/design.md section 2).
#
# This is what a person writes and reviews. It is a ceiling, never the
# authority: the authority is whatever `lex-sys authority` derives from src/.
# scripts/check.py fails when a derived label is not allowed here, when
# `bounded` is false, or when any foreign symbol appears. Widening the broker is
# an edit to this file: a reviewable diff.
#
# Labels are compared by name. Issue #9 tightens this to the exact argument
# (the port in net_in) once the listener exists and the compiler's spelling of
# it is known.

[mqtt]
allow = ["args", "heap", "net_in", "conn_accept", "conn_read", "conn_write", "poll", "clock", "io_write", "err_write"]
